categories: ["cs.LG", "cs.AI", "cs.RO"]
keywords:
  - "reinforcement learning"
  - "deep learning"
  - "robot"
  - "robotic"
  - "robotics"

exclude_keywords: []           # 不排除任何关键词，可按需添加
logic: "AND"                   # 属于上述学科 且 命中任一关键词
max_results: 30
sort_by: "lastUpdatedDate"
sort_order: "descending"

# zh / en / both
lang: "both"

# —— 摘要设置 ——
summary:
  mode: llm                    # none / heuristic / llm
  scope: "both"                # tldr / full / both

# —— 邮件发送（QQ 邮箱） ——
email:
  enabled: true
  subject: "[arXiv] Daily Digest"
  smtp_server: "smtp.qq.com"
  smtp_port: 465
  smtp_pass_env: "SMTP_PASS"
  tls: "ssl"                   # auto / ssl / starttls
  debug: false
  detail: "full"               # simple / full
  max_items: 30
  attach_md: true
  attach_pdf: false

# —— LLM（OpenAI 兼容：DeepSeek / SiliconFlow） ——
llm:
  provider: "openai-compatible"
  base_url: "https://api.deepseek.com"   # SiliconFlow 改为 https://api.siliconflow.cn
  model: "deepseek-chat"                 # SiliconFlow 例：Qwen/Qwen3-8B
  api_key_env: "OPENAI_COMPAT_API_KEY"

  system_prompt_en: |
    You are a senior paper-reading assistant. Based on the given metadata and abstract,
    write ONE concise paragraph in English that covers: research motivation, main method,
    and key experimental findings. Be objective and specific; avoid marketing language.
    Preserve any provided links, but do NOT repeat them in the paragraph.
  system_prompt_zh: |
    你是资深论文阅读助手。基于给定的论文元信息与摘要，用中文写「一段」简洁的总结，
    包含研究动机、核心方法与关键实验结果。保持客观、术语准确；避免营销式表述。
    如有链接请保留，但不要在总结里重复链接。

# —— 中文翻译设置（用 LLM 翻译 title/summary） ——
translate:
  enabled: true
  lang: "zh"
  fields: ["title", "summary"]

site:
  enabled: true
  dir: "docs"
  title: "arXiv 论文速递"
  keep_runs: 1024
  theme: "light"
  accent: "#2563eb"

freshness:
  since_days: 3                # 只看最近 3 天内新提交/更新的论文
  unique_only: true            # 跨天去重（见过的 arXiv ID 不再重复发）
  state_path: ".state/seen.json"
  fallback_when_empty: false

scrape:
  html: true
  pdf_if_missing: true
  pdf_first_page: false
  timeout: 10
